<!-- ORIGINAL DISCOVERY LOGIC (UNCHANGED) -->
<script>
const genres = [
  { name: "Pop", songs: ["Shape of You","Blinding Lights","Levitating","Watermelon Sugar"] },
  { name: "Rock", songs: ["Bohemian Rhapsody","Hotel California","Smells Like Teen Spirit"] },
  { name: "Jazz", songs: ["Take Five","What a Wonderful World","So What"] },
  { name: "Hip-hop", songs: ["God's Plan","Lose Yourself","HUMBLE."] },
  { name: "EDM", songs: ["Animals","Titanium","Lean On"] },
  { name: "Classical", songs: ["Moonlight Sonata","Canon in D","Swan Lake"] },
  { name: "Bollywood", songs: ["Tum Hi Ho","Kesariya","Raabta"] },
  { name: "Indie", songs: ["Cold/Mess","Alag Aasmaan","Riha"] }
];

const moods = [
  { name: "Chill", songs: ["Let Her Go","Death Bed","Riptide"] },
  { name: "Romantic", songs: ["Perfect","Tum Hi Ho","All of Me"] },
  { name: "Party", songs: ["Uptown Funk","Dance Monkey","Taki Taki"] },
  { name: "Focus", songs: ["Weightless","Clair de Lune","River Flows In You"] }
];

const artists = [
  { name: "Taylor Swift", songs: ["Love Story","Cruel Summer","Style"] },
  { name: "Arijit Singh", songs: ["Tum Hi Ho","Channa Mereya","Raabta"] },
  { name: "Ed Sheeran", songs: ["Perfect","Photograph","Shape of You"] },
  { name: "A.R. Rahman", songs: ["Kun Faya Kun","Dil Se Re","Tere Bina"] }
];

function render(containerId, data, prefix) {
  const container = document.getElementById(containerId);
  data.forEach((item, i) => {
    const col = document.createElement("div");
    col.className = "col-md-6";
    col.innerHTML = `
      <div class="genre-card">
        <h5>${item.name}</h5>
        <button class="btn btn-outline-primary mt-2" onclick="toggle('${prefix}-${i}')">View Songs</button>
        <div class="song-list" id="${prefix}-${i}">
          ${item.songs.map(s => `<a href="#" onclick="playSong('${s}')">▪️ ${s}</a>`).join("")}
        </div>
      </div>`;
    container.appendChild(col);
  });
}

render("genreContainer", genres, "genre");
render("moodContainer", moods, "mood");
render("artistContainer", artists, "artist");

function toggle(id) {
  const el = document.getElementById(id);
  el.style.display = el.style.display === "block" ? "none" : "block";
}

function playSong(song) {
  const audio = document.getElementById("audioPlayer");
  audio.src = `assets/audio/${song.replaceAll(" ","_").toLowerCase()}.mp3`;
  audio.style.display = "block";
  audio.play();
}
</script>

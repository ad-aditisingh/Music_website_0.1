<!-- DISCOVERY LOGIC -->
<script>
const genres = [
  { name: "Pop", songs: ["Shape of You", "Blinding Lights", "Levitating"] },
  { name: "Rock", songs: ["Bohemian Rhapsody", "Hotel California"] },
  { name: "Jazz", songs: ["Take Five", "So What"] },
  { name: "Hip-hop", songs: ["Lose Yourself", "God's Plan"] },
  { name: "EDM", songs: ["Animals", "Titanium"] },
  { name: "Classical", songs: ["Moonlight Sonata", "Canon in D"] }
];

const container = document.getElementById("genreContainer");

genres.forEach((genre, i) => {
  const col = document.createElement("div");
  col.className = "col-md-4";
  col.innerHTML = `
    <div class="genre-card text-center">
      <h5>${genre.name}</h5>
      <button class="btn btn-outline-primary mt-2" onclick="toggle(${i})">View Songs</button>
      <div class="song-list" id="list-${i}">
        ${genre.songs.map(s => `<a href="#" onclick="play('${s}')">${s}</a>`).join("")}
      </div>
    </div>`;
  container.appendChild(col);
});

function toggle(i) {
  const el = document.getElementById(`list-${i}`);
  el.style.display = el.style.display === "block" ? "none" : "block";
}

function play(name) {
  const audio = document.getElementById("audioPlayer");
  audio.src = `assets/audio/${name.replaceAll(" ", "_").toLowerCase()}.mp3`;
  audio.style.display = "block";
  audio.play();
}
</script>

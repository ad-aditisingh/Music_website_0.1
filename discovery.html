<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Discovery | UmaaG</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- AOS -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

  <style>
    :root {
      --bg-main: #000;
      --bg-card: #121212;
      --text-main: #fff;
      --text-muted: #b3b3b3;
      --accent-primary: #BEFC5C;
      --accent-secondary: #C084FC;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      margin: 0;
    }

    /* Ambient background */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-bg span {
      position: absolute;
      width: 45vw;
      height: 45vw;
      background: radial-gradient(circle, rgba(190,252,92,0.16), transparent 60%);
      animation: float 30s infinite linear;
    }

    .ambient-bg span:nth-child(1) { top: -10%; left: -10%; }
    .ambient-bg span:nth-child(2) {
      top: 35%;
      left: 60%;
      animation-delay: -10s;
      background: radial-gradient(circle, rgba(192,132,252,0.18), transparent 60%);
    }
    .ambient-bg span:nth-child(3) {
      top: 65%;
      left: 15%;
      animation-delay: -18s;
    }

    @keyframes float {
      0% { transform: translate(0,0); }
      50% { transform: translate(60px,-40px); }
      100% { transform: translate(0,0); }
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 999;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
    }

    .navbar-brand {
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent-secondary) !important;
    }

    .nav-link {
      color: var(--text-main) !important;
    }

    .nav-link.active,
    .nav-link:hover {
      color: var(--accent-primary) !important;
    }

    section, footer, .navbar {
      position: relative;
      z-index: 1;
    }

    /* Page header */
    .page-header {
      padding-top: 140px;
      padding-bottom: 80px;
      text-align: center;
    }

    .page-header h1 {
      font-size: clamp(2.8rem, 6vw, 4rem);
      font-weight: 700;
      margin-bottom: 12px;
    }

    .page-header p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
      font-size: 1.1rem;
    }

    /* Image cards */
    .genre-card {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      background-size: cover;
      background-position: center;
      transition: transform 0.3s ease;
    }

    .genre-card:hover {
      transform: translateY(-6px);
    }

    .genre-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.35),
        rgba(0,0,0,0.85)
      );
      z-index: 0;
    }

    .genre-card * {
      position: relative;
      z-index: 1;
    }

    .genre-card h5 {
      color: var(--accent-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .song-list {
      display: none;
      margin-top: 15px;
      text-align: left;
    }

    .song-list a {
      display: block;
      color: var(--accent-primary);
      text-decoration: none;
      padding: 4px 0;
    }

    .btn-outline-primary {
      border-color: var(--accent-secondary);
      color: var(--accent-secondary);
    }

    .btn-outline-primary:hover {
      background: var(--accent-secondary);
      color: #000;
    }

    footer {
      padding: 30px 0;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>

<body>

<!-- Ambient Background -->
<div class="ambient-bg">
  <span></span>
  <span></span>
  <span></span>
</div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">UMAAG</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="career.html">Career</a></li>
        <li class="nav-item"><a class="nav-link active" href="discovery.html">Discovery</a></li>
        <li class="nav-item"><a class="nav-link" href="creation.html">Creation</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- HEADER -->
<section class="page-header">
  <h1>Discover Music</h1>
  <p>Explore music by genres, moods, and artists.</p>
</section>

<!-- GENRES -->
<section class="container my-5">
  <h2 class="text-center mb-4">Genres</h2>
  <div class="row g-4" id="genreContainer"></div>
</section>

<!-- MOODS & ARTISTS -->
<section class="container my-5">
  <div class="row g-4">
    <div class="col-md-6">
      <h2 class="text-center mb-4">Moods</h2>
      <div class="row g-4" id="moodContainer"></div>
    </div>
    <div class="col-md-6">
      <h2 class="text-center mb-4">Artists</h2>
      <div class="row g-4" id="artistContainer"></div>
    </div>
  </div>
</section>

<!-- AUDIO -->
<audio id="audioPlayer" controls style="display:none;width:100%;margin-top:30px;"></audio>

<footer>
  &copy; 2025 UMAAG
</footer>

<!-- BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- DISCOVERY LOGIC -->
<script>
const genres = [
  { name: "Pop", songs: ["Shape of You","Blinding Lights","Levitating","Watermelon Sugar"] },
  { name: "Rock", songs: ["Bohemian Rhapsody","Hotel California","Smells Like Teen Spirit"] },
  { name: "Jazz", songs: ["Take Five","What a Wonderful World","So What"] },
  { name: "Hip-hop", songs: ["God's Plan","Lose Yourself","HUMBLE."] },
  { name: "EDM", songs: ["Animals","Titanium","Lean On"] },
  { name: "Classical", songs: ["Moonlight Sonata","Canon in D","Swan Lake"] },
  { name: "Bollywood", songs: ["Tum Hi Ho","Kesariya","Raabta"] },
  { name: "Indie", songs: ["Cold/Mess","Alag Aasmaan","Riha"] }
];

const moods = [
  { name: "Chill", songs: ["Let Her Go","Death Bed","Riptide"] },
  { name: "Romantic", songs: ["Perfect","Tum Hi Ho","All of Me"] },
  { name: "Party", songs: ["Uptown Funk","Dance Monkey","Taki Taki"] },
  { name: "Focus", songs: ["Weightless","Clair de Lune","River Flows In You"] }
];

const artists = [
  { name: "Taylor Swift", songs: ["Love Story","Cruel Summer","Style"] },
  { name: "Arijit Singh", songs: ["Tum Hi Ho","Channa Mereya","Raabta"] },
  { name: "Ed Sheeran", songs: ["Perfect","Photograph","Shape of You"] },
  { name: "A.R. Rahman", songs: ["Kun Faya Kun","Dil Se Re","Tere Bina"] }
];

function slugify(text) {
  return text.toLowerCase().replace(/[^a-z0-9]+/g, "-");
}

function render(containerId, data, prefix) {
  const container = document.getElementById(containerId);
  data.forEach((item, i) => {
    const col = document.createElement("div");
    col.className = "col-md-6";
    col.innerHTML = `
      <div class="genre-card"
           data-aos="fade-up"
           data-bg="assets/images/${prefix}-${slugify(item.name)}.jpg">
        <h5>${item.name}</h5>
        <button class="btn btn-outline-primary mt-2"
                onclick="toggle('${prefix}-${i}')">View Songs</button>
        <div class="song-list" id="${prefix}-${i}">
          ${item.songs.map(s => `<a href="#" onclick="event.preventDefault(); playSong('${s}')">▪ ${s}</a>`).join("")}
        </div>
      </div>`;
    container.appendChild(col);
  });
}

render("genreContainer", genres, "genre");
render("moodContainer", moods, "mood");
render("artistContainer", artists, "artist");

document.querySelectorAll(".genre-card").forEach(card => {
  const bg = card.getAttribute("data-bg");
  if (bg) card.style.backgroundImage = `url('${bg}')`;
});

function toggle(id) {
  document.querySelectorAll(".song-list").forEach(list => {
    if (list.id !== id) list.style.display = "none";
  });
  const el = document.getElementById(id);
  el.style.display = el.style.display === "block" ? "none" : "block";
}

function playSong(song) {
  const audio = document.getElementById("audioPlayer");
  audio.src = `assets/audio/${song.replaceAll(" ", "_").toLowerCase()}.mp3`;
  audio.style.display = "block";
  audio.play();
}

AOS.init({ once: true });
</script>

</body>
</html>

  <style>
    :root {
      --bg-main: #000;
      --bg-card: #121212;
      --text-main: #fff;
      --text-muted: #b3b3b3;
      --accent-primary: #BEFC5C;
      --accent-secondary: #C084FC;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding-top: 80px;
    }

    /* Ambient background */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-bg span {
      position: absolute;
      width: 45vw;
      height: 45vw;
      background: radial-gradient(circle, rgba(190,252,92,0.16), transparent 60%);
      animation: float 30s infinite linear;
    }

    .ambient-bg span:nth-child(1) { top: -10%; left: -10%; }
    .ambient-bg span:nth-child(2) {
      top: 35%;
      left: 60%;
      animation-delay: -10s;
      background: radial-gradient(circle, rgba(192,132,252,0.18), transparent 60%);
    }
    .ambient-bg span:nth-child(3) {
      top: 65%;
      left: 15%;
      animation-delay: -18s;
    }

    @keyframes float {
      0% { transform: translate(0,0); }
      50% { transform: translate(60px,-40px); }
      100% { transform: translate(0,0); }
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 999;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
    }

    .navbar-brand {
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent-secondary) !important;
    }

    .nav-link {
      color: var(--text-main) !important;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--accent-primary) !important;
    }

    section,
    footer {
      position: relative;
      z-index: 1;
    }

    /* Hero */
    .hero {
      position: relative;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(2.6rem, 6vw, 3.8rem);
      font-weight: 700;
      text-shadow: 0 0 20px rgba(192,132,252,0.4);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Cards */
    .career-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 30px;
      height: 100%;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .career-card:hover {
      transform: translateY(-6px);
    }

    .career-card h5 {
      color: var(--accent-secondary);
      font-weight: 600;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .career-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .btn-custom {
      background-color: var(--accent-secondary);
      border: none;
      border-radius: 25px;
      padding: 8px 20px;
      color: white;
      display: inline-block;
      margin-top: 10px;
      transition: 0.3s;
      text-decoration: none;
    }

    .btn-custom:hover {
      background-color: #7a4fb4;
      box-shadow: 0 0 10px rgba(153,102,204,0.5);
      color: white;
    }

    /* Accordion */
    .accordion-item {
      background: var(--bg-card);
      border-radius: 12px;
      margin-bottom: 10px;
      border: none;
    }

    .accordion-button {
      background: var(--bg-card);
      color: var(--text-main);
      font-weight: 600;
    }

    .accordion-button:not(.collapsed) {
      color: var(--accent-secondary);
      background: #1a1a1a;
    }

    .accordion-body {
      color: var(--text-muted);
    }

    footer {
      padding: 30px 0;
      text-align: center;
      color: var(--text-muted);
      background: var(--bg-card);
      margin-top: 60px;
    }

    footer a {
      color: var(--accent-secondary);
      text-decoration: none;
    }
  </style>
</head>

  <style>
    :root{
      --accent1: #9966CC;
      --accent2: #7C4DFF;
      --bg: #0A0A0F;
      --card-bg: #121826;
      --muted: #A1A1AA;
    }

    html,body{height:100%}

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg);
      color: #E6EDF3;
      margin:0;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    h2, h3, h5, .navbar-brand {
      font-family: 'Poppins', cursive;
      color: var(--accent1);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    a { color: var(--accent1); text-decoration: none; }
    a:hover { color: var(--accent2); }

    .navbar {
      background-color: rgba(10,10,15,0.95);
      box-shadow: 0 0 10px #a200ff22;
    }

    .navbar-brand { color:var(--accent1) !important; font-size:1.5rem; }
    .navbar-nav .nav-link { color: #E6EDF3 !important; transition: color .3s; }
    .navbar-nav .nav-link:hover { color:var(--accent1) !important; }

    .career-card {
      background-color: var(--card-bg);
      border-radius: 15px;
      box-shadow: 0 0 10px #a200ff22;
      padding: 30px;
      height: 100%;
      text-align: center;
      transition: 0.3s;
    }

    .career-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 25px #a200ff22;
    }

    .career-card h5 { margin-top: 10px; font-weight: 600; }
    .career-card p { font-size: 0.95rem; color: #ccc; }

    .resource-links a {
      display: block;
      color: var(--accent1);
      padding: 6px 0;
    }

    .btn-custom {
      background-color: var(--accent1);
      border: none;
      border-radius: 25px;
      padding: 8px 20px;
      color: white;
      margin-top: 10px;
      transition: 0.3s;
    }

    .btn-custom:hover {
      background-color: #7a4fb4;
      box-shadow: 0 0 10px rgba(153,102,204,0.5);
    }

    footer {
      background-color: #212529;
      color: #ccc;
      text-align: center;
      padding: 20px 0;
      margin-top: 40px;
    }
  </style>

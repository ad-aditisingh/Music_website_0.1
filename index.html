<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UmaaG | Music Platform</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Equalizer CSS -->
  <link rel="stylesheet" href="css/equalizer.css">

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>


  <!-- AOS -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #121212;
      --text-main: #ffffff;
      --text-muted: #b3b3b3;
      --accent-primary: #BEFC5C;
      --accent-secondary: #C084FC;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-top: 80px;
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 9999;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(190,252,92,0.15);
    }

    .navbar-brand {
      color: var(--accent-secondary) !important;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .nav-link {
      color: var(--text-main) !important;
    }

    .nav-link:hover {
      color: var(--accent-primary) !important;
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .equalizer-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle,
        rgba(190,252,92,0.15),
        rgba(0,0,0,0.95) 70%
      );
      z-index: 1;
    }


    .hero-logo {
      display: flex;
      gap: 0.15em;              /* closer letters */
      font-size: clamp(4rem, 12vw, 9rem);
      font-weight: 700;
      letter-spacing: 0.05em;   /* much tighter */
    }


    .hero-logo .char {
      display: inline-block;
      color: var(--accent-primary);
      text-shadow:
        0 0 20px rgba(190,252,92,0.6),
        0 0 60px rgba(192,132,252,0.4);
    }

    .hero-logo .accent-g {
      color: var(--accent-secondary); /* purple */
      text-shadow:
        0 0 20px rgba(192,132,252,0.7),
        0 0 60px rgba(192,132,252,0.5);
    }


    .about-section {
      background: var(--bg-card);
      padding: 50px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(192,132,252,0.15);
    }

    .feature-card {
      background: var(--bg-card);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(192,132,252,0.15);
      transition: 0.3s;
    }

    .feature-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 25px rgba(190,252,92,0.25);
    }

    footer {
      background: var(--bg-card);
      padding: 20px 0;
      color: var(--text-muted);
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">UMAAG</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="career.html">Career</a></li>
        <li class="nav-item"><a class="nav-link" href="discovery.html">Discovery</a></li>
        <li class="nav-item"><a class="nav-link" href="creation.html">Creation</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="equalizer-bg"></div>

<h1 class="hero-logo">
  <span class="char accent-main">U</span>
  <span class="char accent-main">M</span>
  <span class="char accent-main">A</span>
  <span class="char accent-main">A</span>
  <span class="char accent-g">G</span>
</h1>


</section>

<!-- ABOUT -->
<section class="py-5 text-center">
  <div class="container about-section">
    <h2>Welcome to UmaaG</h2>
    <p class="lead mt-3">
      UmaaG is a creative hub for music lovers and creators.
    </p>
  </div>
</section>

<!-- FEATURES -->
<section class="py-5">
  <div class="container">
    <div class="row g-4">
      <div class="col-md-4">
        <div class="feature-card text-center">
          <h5>Career Guidance</h5>
        </div>
      </div>
      <div class="col-md-4">
        <div class="feature-card text-center">
          <h5>Music Discovery</h5>
        </div>
      </div>
      <div class="col-md-4">
        <div class="feature-card text-center">
          <h5>Music Creation</h5>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="text-center">
  <p>&copy; 2025 UMAAG</p>
</footer>

<!-- SCRIPTS -->
<script>
  AOS.init({ once: true });

  const letters = document.querySelectorAll(".hero-logo .char");
  const finalText = ["U", "M", "A", "A", "G"];
  const randomChars =
    "EFGAअBआCइDEFईGHउIऊJकखगKघचछLMजझटNठOडPढQतRSTथUदVधWनXपफबYभXZमयAFरलवHGशषDEसहH";

  letters.forEach((letter, index) => {
    let i = 0;

    // STATIC position – only opacity
    gsap.fromTo(
      letter,
      { opacity: 0 },
      {
        opacity: 1,
        delay: index * 0.15,
        duration: 0.6,
        ease: "power1.out"
      }
    );

    const scramble = setInterval(() => {
      if (i >= 12) {
        letter.textContent = finalText[index];
        clearInterval(scramble);
      } else {
        letter.textContent =
          randomChars[Math.floor(Math.random() * randomChars.length)];
        i++;
      }
    }, 60);
  });

  /* ===============================
     BRIGHT NEON GLOWS (KEY FIX)
     =============================== */

  const greenGlow = `
    0 0 6px rgba(190,252,92,1),
    0 0 20px rgba(190,252,92,0.95),
    0 0 60px rgba(190,252,92,0.9),
    0 0 120px rgba(190,252,92,0.6)
  `;

  const purpleGlow = `
    0 0 6px rgba(192,132,252,1),
    0 0 20px rgba(192,132,252,0.95),
    0 0 60px rgba(192,132,252,0.9),
    0 0 120px rgba(192,132,252,0.6)
  `;

  // Base glow pulse for whole logo
  gsap.to(".hero-logo", {
    textShadow: greenGlow,
    repeat: -1,
    yoyo: true,
    duration: 2.5,
    delay: 1.8
  });

  // Extra punch for G
  gsap.to(".accent-g", {
    textShadow: purpleGlow,
    repeat: -1,
    yoyo: true,
    duration: 3
  });

  // Navbar entrance
  gsap.from(".navbar", {
    y: -80,
    opacity: 0,
    duration: 1,
    ease: "power2.out"
  });

  /* ===============================
     SCROLL COLOR SWAP (BRIGHT)
     =============================== */

  gsap.registerPlugin(ScrollTrigger);

  ScrollTrigger.create({
    trigger: "body",
    start: "top -80",
    onEnter: () => {
      gsap.to(".accent-main", {
        color: "var(--accent-secondary)",
        textShadow: purpleGlow,
        duration: 0.35
      });

      gsap.to(".accent-g", {
        color: "var(--accent-primary)",
        textShadow: greenGlow,
        duration: 0.35
      });
    },
    onLeaveBack: () => {
      gsap.to(".accent-main", {
        color: "var(--accent-primary)",
        textShadow: greenGlow,
        duration: 0.35
      });

      gsap.to(".accent-g", {
        color: "var(--accent-secondary)",
        textShadow: purpleGlow,
        duration: 0.35
      });
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/equalizer.js"></script>


</body>
</html>

<script>
  AOS.init({ once: true });

  const letters = document.querySelectorAll(".hero-logo .char");
  const finalText = ["U", "M", "A", "A", "G"];
  const randomChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  letters.forEach((letter, index) => {
    let iterations = 0;

    gsap.fromTo(
      letter,
      { y: 60, opacity: 0 },
      {
        y: 0,
        opacity: 1,
        duration: 1,
        delay: index * 0.15,
        ease: "power3.out"
      }
    );

    const scramble = setInterval(() => {
      if (iterations >= 12) {
        letter.textContent = finalText[index];
        clearInterval(scramble);
      } else {
        letter.textContent =
          randomChars[Math.floor(Math.random() * randomChars.length)];
        iterations++;
      }
    }, 60);
  });

  // glow pulse AFTER letters settle
  gsap.to(".hero-logo", {
    textShadow: "0 0 40px rgba(190,252,92,0.9), 0 0 100px rgba(192,132,252,0.6)",
    repeat: -1,
    yoyo: true,
    duration: 2.5,
    delay: 1.8
  });

  // navbar entrance
  gsap.from(".navbar", {
    y: -80,
    opacity: 0,
    duration: 1,
    ease: "power2.out"
  });
</script>

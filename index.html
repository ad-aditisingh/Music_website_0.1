<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UmaaG | Music Platform</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

  <!-- AOS -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

  <style>
    :root {
      --bg-main: #000;
      --text-main: #fff;
      --text-muted: #b3b3b3;
      --accent-primary: #BEFC5C;
      --accent-secondary: #C084FC;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      padding-top: 80px;
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 999;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
    }

    .navbar-brand {
      font-weight: 700;
      letter-spacing: 2px;
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .hero-logo {
      display: flex;
      gap: 0.12em;
      font-size: clamp(4rem, 12vw, 9rem);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .hero-logo .char {
      display: inline-block;
      color: var(--accent-primary);
    }

    .hero-logo .accent-g {
      color: var(--accent-secondary);
    }

    /* Scroll paragraph */
    .umaag-scroll-text {
      font-size: clamp(1.4rem, 2.5vw, 1.7rem);
      line-height: 1.8;
      color: var(--text-muted);
      margin-top: 60px;
    }

    .umaag-link {
      color: var(--accent-primary);
      font-weight: 600;
      text-decoration: none;
    }

    .umaag-link:hover {
      text-decoration: underline;
    }

    footer {
      padding: 20px;
      color: var(--text-muted);
      text-align: center;
    }


    /* Ambient background animation */
.ambient-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.ambient-bg span {
  position: absolute;
  width: 45vw;
  height: 45vw;
  background: radial-gradient(
    circle,
    rgba(190,252,92,0.18),
    transparent 60%
  );
  animation: float 25s infinite linear;
}

.ambient-bg span:nth-child(1) {
  top: -10%;
  left: -10%;
}

.ambient-bg span:nth-child(2) {
  top: 30%;
  left: 60%;
  animation-delay: -8s;
  background: radial-gradient(
    circle,
    rgba(192,132,252,0.18),
    transparent 60%
  );
}

.ambient-bg span:nth-child(3) {
  top: 60%;
  left: 10%;
  animation-delay: -15s;
}

@keyframes float {
  0% {
    transform: translate(0, 0);
  }
  50% {
    transform: translate(60px, -40px);
  }
  100% {
    transform: translate(0, 0);
  }
}

    .hero,
    .navbar,
    section,
    footer {
      position: relative;
      z-index: 1;
    }


  </style>
</head>

<body>

<div class="ambient-bg">
  <span></span>
  <span></span>
  <span></span>
</div>


  
<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">UMAAG</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="career.html">Career</a></li>
        <li class="nav-item"><a class="nav-link" href="discovery.html">Discovery</a></li>
        <li class="nav-item"><a class="nav-link" href="creation.html">Creation</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <h1 class="hero-logo">
    <span class="char">U</span>
    <span class="char">M</span>
    <span class="char">A</span>
    <span class="char">A</span>
    <span class="char accent-g">G</span>
  </h1>
</section>

<!-- SCROLL PARAGRAPH -->
<section class="py-5">
  <div class="container text-center" style="max-width: 800px;">
    <p class="umaag-scroll-text" data-aos="fade-up">
      UmaaG is built around
      <a href="career.html" class="umaag-link">career</a>,
      <a href="discovery.html" class="umaag-link">discovery</a>,
      and
      <a href="creation.html" class="umaag-link">creation</a>
      — helping you explore music paths, discover new sounds, and create your own identity in the music world.
    </p>
  </div>
</section>

<footer>
  &copy; 2025 UMAAG
</footer>

<!-- SCRIPTS -->
<script>
  AOS.init({ once: true });

  const letters = document.querySelectorAll(".hero-logo .char");
  const finalText = ["U", "M", "A", "A", "G"];
  const randomChars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZअआइईउऊकखगघचछजझटठडढतथदधनपफबभमयरलवशषसह";

  letters.forEach((letter, index) => {
    let iterations = 0;

    // Fade in only (no movement)
    gsap.fromTo(
      letter,
      { opacity: 0 },
      { opacity: 1, duration: 0.4, delay: index * 0.15 }
    );

    const scramble = setInterval(() => {
      if (iterations >= 12) {
        letter.textContent = finalText[index];
        clearInterval(scramble);
      } else {
        letter.textContent =
          randomChars[Math.floor(Math.random() * randomChars.length)];
        iterations++;
      }
    }, 60);
  });

  // Navbar entrance
  gsap.from(".navbar", {
    y: -50,
    opacity: 0,
    duration: 0.8,
    ease: "power2.out"
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

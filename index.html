<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UmaaG | Music Platform</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Equalizer CSS -->
  <link rel="stylesheet" href="css/equalizer.css">

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

  <!-- AOS -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #121212;
      --text-main: #ffffff;
      --text-muted: #b3b3b3;
      --accent-primary: #BEFC5C;
      --accent-secondary: #C084FC;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-top: 80px;
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 9999;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(10px);
    }

    .navbar-brand {
      color: var(--accent-secondary) !important;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .nav-link {
      color: var(--text-main) !important;
    }

    .nav-link:hover {
      color: var(--accent-primary) !important;
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .equalizer-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle,
        rgba(190,252,92,0.15),
        rgba(0,0,0,0.95) 70%
      );
      z-index: 1;
    }

    .hero-logo {
      display: flex;
      gap: 0.15em;
      font-size: clamp(4rem, 12vw, 9rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      z-index: 2;
    }

    .hero-logo .char {
      color: var(--accent-primary);
    }

    .hero-logo .accent-g {
      color: var(--accent-secondary);
    }

    /* Scroll paragraph */
    .umaag-scroll-text {
      font-size: clamp(1.3rem, 2.5vw, 1.6rem);
      line-height: 1.8;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    .umaag-link {
      color: var(--accent-primary);
      font-weight: 600;
      text-decoration: none;
      position: relative;
    }

    .umaag-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0;
      height: 2px;
      background: var(--accent-primary);
      transition: width 0.3s ease;
    }

    .umaag-link:hover::after {
      width: 100%;
    }

    /* Media (image or video) */
    .umaag-media {
      width: 100%;
      max-width: 620px;
      margin: 0 auto 35px;
      border-radius: 18px;
      display: block;
      opacity: 0.95;
    }

    footer {
      background: var(--bg-card);
      padding: 20px 0;
      color: var(--text-muted);
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">UMAAG</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="career.html">Career</a></li>
        <li class="nav-item"><a class="nav-link" href="discovery.html">Discovery</a></li>
        <li class="nav-item"><a class="nav-link" href="creation.html">Creation</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="equalizer-bg"></div>

  <h1 class="hero-logo">
    <span class="char">U</span>
    <span class="char">M</span>
    <span class="char">A</span>
    <span class="char">A</span>
    <span class="char accent-g">G</span>
  </h1>
</section>

<!-- SCROLL SECTION -->
<section class="py-5">
  <div class="container text-center" style="max-width: 750px;">

    <!-- IMAGE (can replace with video) -->
    <img
      src="assets/images/umaag-vibe.jpg"
      alt="UmaaG music vibe"
      class="umaag-media"
      data-aos="fade-up"
    />

    <p class="umaag-scroll-text"
       data-aos="fade-up"
       data-aos-delay="150">
